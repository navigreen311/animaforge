name: Deploy to Production

# DISABLED ON PUSH — deliberately, not by neglect.
#
# This workflow ran on every push to main and failed every time. Five
# consecutive runs before it was turned off; a workflow that is always red
# trains people to stop reading red.
#
# It cannot succeed today. Three independent blockers, none of them a code bug:
#
#   1. No repository secrets exist. `gh secret list` returns nothing, and this
#      workflow needs PRODUCTION_KUBECONFIG, PRODUCTION_BASE_URL and
#      PRODUCTION_INTERNAL_URL. The deploy job pipes an empty string into
#      `base64 -d` and writes a garbage kubeconfig.
#   2. There is no cluster to deploy to, and `k8s/overlays/production/` — the
#      path `kubectl apply -k` targets — does not exist. k8s/ has no overlays
#      directory at all.
#   3. Four of the twelve services in the build matrix have no Dockerfile:
#      export, notification, search, analytics. `export` is the first to fail
#      and cancels the other eleven, which is the error you actually see.
#
# `workflow_dispatch` is kept so this can be run deliberately the moment the
# infrastructure exists. The `preflight` job below states what is still missing
# rather than letting the run die somewhere confusing.
#
# Disabled by commit 9777fe3, "ci: stop deploy workflows running on push, and
# say why", on 2026-08-15, as part of the CI-hardening work in PR #81. It was a
# deliberate call with a stated reason, not a silent breakage.
#
# Re-verified on 2026-08-16 rather than taken on trust, and all three blockers
# still hold:
#   * `gh secret list` returns nothing -- no PRODUCTION_* secrets exist
#   * `k8s/` contains ai, data, governance, monitoring, platform and some
#     top-level manifests, but no `overlays/` directory at all
#   * services/{export,notification,search,analytics}/Dockerfile are all absent
#
# Before the push trigger goes back on, all three must be true:
#   1. PRODUCTION_KUBECONFIG, PRODUCTION_BASE_URL and PRODUCTION_INTERNAL_URL
#      exist as repository secrets and point at a reachable cluster.
#   2. k8s/overlays/production/ exists and `kubectl apply -k` against it
#      succeeds on a dry run.
#   3. Every service in the build matrix has a Dockerfile, or the matrix is
#      narrowed to those that do.
# The preflight job below checks exactly these and reports which are missing.
#
# Re-enable the push trigger when preflight passes. Tracked in #21.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.2.3)'
        required: false
        type: string
      skip_approval:
        description: 'Skip manual approval (emergency only)'
        required: false
        type: boolean
        default: false

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/animaforge
  K8S_NAMESPACE: animaforge-production

jobs:
  preflight:
    name: Preflight - deployment prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check deployment prerequisites
        env:
          KUBECONFIG_B64: ${{ secrets.PRODUCTION_KUBECONFIG }}
          BASE_URL: ${{ secrets.PRODUCTION_BASE_URL }}
          INTERNAL_URL: ${{ secrets.PRODUCTION_INTERNAL_URL }}
        run: |
          missing=0
          note() { echo "::error::$1"; missing=1; }

          [ -n "$KUBECONFIG_B64" ] || note "secret PRODUCTION_KUBECONFIG is not set"
          [ -n "$BASE_URL" ]       || note "secret PRODUCTION_BASE_URL is not set"
          [ -n "$INTERNAL_URL" ]   || note "secret PRODUCTION_INTERNAL_URL is not set"

          [ -d k8s/overlays/production ]             || note "k8s/overlays/production/ does not exist (kubectl apply -k target)"

          for svc in export notification search analytics; do
            [ -f "services/$svc/Dockerfile" ]               || note "services/$svc/Dockerfile does not exist but $svc is in the build matrix"
          done

          if [ "$missing" = "1" ]; then
            echo "Production deployment prerequisites are not met. See the errors above."
            echo "This workflow is intentionally not run on push; see the comment at the top."
            exit 1
          fi
          echo "All deployment prerequisites present."

  prepare:
    name: Prepare Release
    runs-on: ubuntu-latest
    needs: preflight
    outputs:
      version: ${{ steps.version.outputs.tag }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        env:
          # Passed via env rather than interpolated into the script body so a
          # crafted workflow_dispatch input cannot inject shell commands.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ -n "$INPUT_VERSION" ]]; then
            VERSION="$INPUT_VERSION"
          else
            # Auto-generate version from date + short SHA
            VERSION="v$(date +%Y.%m.%d)-${GITHUB_SHA::7}"
          fi
          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=prod-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          # `context` is the docker build context and `file` the Dockerfile.
          # platform-api, auth and web build from the repo root: they are npm
          # workspaces whose lockfile lives there, and web also needs the
          # @animaforge/db workspace package. See #20.
          - { name: platform-api, context: ., file: services/platform-api/Dockerfile }
          - { name: auth, context: ., file: services/auth/Dockerfile }
          - { name: billing, context: services/billing, file: services/billing/Dockerfile }
          - { name: realtime, context: services/realtime, file: services/realtime/Dockerfile }
          - { name: workers, context: services/workers, file: services/workers/Dockerfile }
          - { name: gateway, context: services/gateway, file: services/gateway/Dockerfile }
          - { name: export, context: services/export, file: services/export/Dockerfile }
          - {
              name: notification,
              context: services/notification,
              file: services/notification/Dockerfile,
            }
          - { name: search, context: services/search, file: services/search/Dockerfile }
          - { name: analytics, context: services/analytics, file: services/analytics/Dockerfile }
          - { name: ai-api, context: services/ai-api, file: services/ai-api/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=raw,value=${{ needs.prepare.outputs.image_tag }}
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=production-latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_VERSION=${{ needs.prepare.outputs.version }}
            BUILD_SHA=${{ github.sha }}

  deploy-blue-green:
    name: Blue-Green Deploy to Production
    runs-on: ubuntu-latest
    needs: [prepare, build-and-push]
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Determine active slot
        id: slot
        run: |
          ACTIVE=$(kubectl get svc animaforge-router \
            --namespace ${{ env.K8S_NAMESPACE }} \
            -o jsonpath='{.spec.selector.slot}' 2>/dev/null || echo "blue")
          if [[ "$ACTIVE" == "blue" ]]; then
            TARGET="green"
          else
            TARGET="blue"
          fi
          echo "active=$ACTIVE" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"
          echo "Active slot: $ACTIVE, deploying to: $TARGET"

      - name: Deploy to target slot
        run: |
          IMAGE_TAG="${{ needs.prepare.outputs.image_tag }}"
          TARGET="${{ steps.slot.outputs.target }}"

          # Apply deployment to the inactive slot
          export IMAGE_TAG TARGET
          envsubst < k8s/overlays/production/kustomization.yml > k8s/overlays/production/kustomization-resolved.yml
          mv k8s/overlays/production/kustomization-resolved.yml k8s/overlays/production/kustomization.yml

          kubectl apply -k k8s/overlays/production/ \
            --namespace ${{ env.K8S_NAMESPACE }} \
            -l slot=$TARGET

      - name: Wait for target slot rollout
        run: |
          TARGET="${{ steps.slot.outputs.target }}"
          services=(platform-api auth billing realtime workers gateway export notification search analytics ai-api web)
          for svc in "${services[@]}"; do
            echo "Waiting for $svc-$TARGET rollout..."
            kubectl rollout status deployment/$svc-$TARGET \
              --namespace ${{ env.K8S_NAMESPACE }} \
              --timeout=300s || exit 1
          done

      - name: Health check target slot
        id: health
        run: |
          chmod +x scripts/health-check.sh
          TARGET="${{ steps.slot.outputs.target }}"
          HEALTH_CHECK_URL="${{ secrets.PRODUCTION_INTERNAL_URL }}-$TARGET" \
            scripts/health-check.sh

      - name: Switch traffic to target slot
        if: success()
        run: |
          TARGET="${{ steps.slot.outputs.target }}"
          kubectl patch svc animaforge-router \
            --namespace ${{ env.K8S_NAMESPACE }} \
            -p "{\"spec\":{\"selector\":{\"slot\":\"$TARGET\"}}}"
          echo "Traffic switched to $TARGET slot"

      - name: Verify production health
        run: |
          sleep 10
          chmod +x scripts/health-check.sh
          HEALTH_CHECK_URL="${{ secrets.PRODUCTION_BASE_URL }}" \
            scripts/health-check.sh

  rollback:
    name: Rollback on Failure
    runs-on: ubuntu-latest
    needs: [prepare, deploy-blue-green]
    if: failure()
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.PRODUCTION_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Rollback to previous slot
        run: |
          chmod +x scripts/rollback.sh
          scripts/rollback.sh production

      - name: Notify rollback
        run: |
          echo "PRODUCTION ROLLBACK executed for version ${{ needs.prepare.outputs.version }}"
          echo "Commit: ${{ github.sha }}"
          # TODO: Send urgent alert via PagerDuty / Slack
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H 'Content-Type: application/json' \
          #   -d '{"text": ":rotating_light: PRODUCTION ROLLBACK: ${{ needs.prepare.outputs.version }}"}'

  tag-release:
    name: Tag GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, deploy-blue-green]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [[ -n "$PREV_TAG" ]]; then
            CHANGELOG=$(git log "$PREV_TAG"..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" --no-merges -20)
          fi
          # Write to file to handle multiline
          echo "$CHANGELOG" > /tmp/changelog.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: 'AnimaForge ${{ needs.prepare.outputs.version }}'
          body_path: /tmp/changelog.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [prepare, deploy-blue-green, tag-release]
    if: always()
    steps:
      - name: Notify deployment status
        run: |
          DEPLOY_STATUS="${{ needs.deploy-blue-green.result }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          echo "Production deployment: $DEPLOY_STATUS"
          echo "Version: $VERSION"
          echo "Commit: ${{ github.sha }}"
          # TODO: Replace with actual notification integrations
          # Slack / Discord / PagerDuty stubs
