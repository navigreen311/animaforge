name: Deploy to Staging

# DISABLED ON PUSH — same three blockers as deploy-production.yml, which has
# the full explanation. In short: no repository secrets exist (this workflow
# needs STAGING_KUBECONFIG), there is no k8s/overlays/staging/ for
# `kubectl apply -k` to target, and four of the twelve services in the build
# matrix have no Dockerfile.
#
# It failed on every push to develop. Kept dispatchable so it can be run
# deliberately once the infrastructure exists; `preflight` says what is
# missing.
#
# Disabled by commit 9777fe3 on 2026-08-15 (PR #81, CI hardening). Re-verified
# on 2026-08-16: no repository secrets exist, k8s/ has no overlays/ directory,
# and services/{export,notification,search,analytics} still have no Dockerfile.
# See deploy-production.yml for the full re-enable checklist.
#
# Re-enable the push trigger when preflight passes. Tracked in #21.
on:
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/animaforge
  K8S_NAMESPACE: animaforge-staging

jobs:
  preflight:
    name: Preflight - deployment prerequisites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check deployment prerequisites
        env:
          KUBECONFIG_B64: ${{ secrets.STAGING_KUBECONFIG }}
        run: |
          missing=0
          note() { echo "::error::$1"; missing=1; }

          [ -n "$KUBECONFIG_B64" ] || note "secret STAGING_KUBECONFIG is not set"

          [ -d k8s/overlays/staging ]             || note "k8s/overlays/staging/ does not exist (kubectl apply -k target)"

          for svc in export notification search analytics; do
            [ -f "services/$svc/Dockerfile" ]               || note "services/$svc/Dockerfile does not exist but $svc is in the build matrix"
          done

          if [ "$missing" = "1" ]; then
            echo "Staging deployment prerequisites are not met. See the errors above."
            exit 1
          fi
          echo "All deployment prerequisites present."

  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          # `context` is the docker build context and `file` the Dockerfile.
          # platform-api, auth and web build from the repo root: they are npm
          # workspaces whose lockfile lives there, and web also needs the
          # @animaforge/db workspace package. See #20.
          - { name: platform-api, context: ., file: services/platform-api/Dockerfile }
          - { name: auth, context: ., file: services/auth/Dockerfile }
          - { name: billing, context: services/billing, file: services/billing/Dockerfile }
          - { name: realtime, context: services/realtime, file: services/realtime/Dockerfile }
          - { name: workers, context: services/workers, file: services/workers/Dockerfile }
          - { name: gateway, context: services/gateway, file: services/gateway/Dockerfile }
          - { name: export, context: services/export, file: services/export/Dockerfile }
          - {
              name: notification,
              context: services/notification,
              file: services/notification/Dockerfile,
            }
          - { name: search, context: services/search, file: services/search/Dockerfile }
          - { name: analytics, context: services/analytics, file: services/analytics/Dockerfile }
          - { name: ai-api, context: services/ai-api, file: services/ai-api/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=sha,prefix=staging-
            type=raw,value=staging-latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Staging K8s
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: staging
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0

      - name: Set kubeconfig
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.STAGING_KUBECONFIG }}" | base64 -d > $HOME/.kube/config

      - name: Deploy to staging
        run: |
          export IMAGE_TAG="staging-${GITHUB_SHA::7}"
          envsubst < k8s/overlays/staging/kustomization.yml > k8s/overlays/staging/kustomization-resolved.yml
          mv k8s/overlays/staging/kustomization-resolved.yml k8s/overlays/staging/kustomization.yml
          kubectl apply -k k8s/overlays/staging/ --namespace ${{ env.K8S_NAMESPACE }}

      - name: Wait for rollout
        run: |
          services=(platform-api auth billing realtime workers gateway export notification search analytics ai-api web)
          for svc in "${services[@]}"; do
            echo "Waiting for $svc rollout..."
            kubectl rollout status deployment/$svc \
              --namespace ${{ env.K8S_NAMESPACE }} \
              --timeout=300s || exit 1
          done

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run smoke tests
        run: |
          chmod +x scripts/health-check.sh
          HEALTH_CHECK_URL="${{ secrets.STAGING_BASE_URL }}" \
            scripts/health-check.sh
        env:
          ENV: staging

      - name: API smoke tests
        run: |
          BASE_URL="${{ secrets.STAGING_BASE_URL }}"
          # Test critical endpoints
          endpoints=("/api/health" "/api/v1/status" "/auth/health")
          for ep in "${endpoints[@]}"; do
            status=$(curl -s -o /dev/null -w "%{http_code}" "$BASE_URL$ep" --max-time 10)
            if [[ "$status" -lt 200 ]] || [[ "$status" -ge 400 ]]; then
              echo "FAIL: $ep returned $status"
              exit 1
            fi
            echo "OK: $ep returned $status"
          done

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [deploy, smoke-tests]
    if: always()
    steps:
      - name: Notify Slack (stub)
        run: |
          STATUS="${{ needs.smoke-tests.result }}"
          # TODO: Replace with actual Slack webhook
          echo "Staging deployment status: $STATUS"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          # curl -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
          #   -H 'Content-Type: application/json' \
          #   -d "{\"text\": \"AnimaForge staging deploy: $STATUS by ${{ github.actor }}\"}"

      - name: Notify Discord (stub)
        run: |
          STATUS="${{ needs.smoke-tests.result }}"
          # TODO: Replace with actual Discord webhook
          echo "Discord notification: Staging deploy $STATUS"
          # curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
          #   -H 'Content-Type: application/json' \
          #   -d "{\"content\": \"AnimaForge staging deploy: $STATUS by ${{ github.actor }}\"}"
