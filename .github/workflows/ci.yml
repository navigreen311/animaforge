name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npx prettier --check "apps/**/*.{ts,tsx}" "services/**/*.ts"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Python lint
        run: |
          pip install ruff
          ruff check services/ai-api/

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Type check apps/web
        run: cd apps/web && npx tsc --noEmit

      - name: Type check services
        run: |
          for svc in platform-api auth billing realtime workers gateway export notification search analytics; do
            if [ -f "services/$svc/tsconfig.json" ]; then
              echo "Type checking services/$svc..."
              cd services/$svc && npx tsc --noEmit && cd ../..
            fi
          done

  test-frontend:
    name: Frontend Tests (Vitest)
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run Vitest
        run: cd apps/web && npx vitest run --coverage --reporter=json --outputFile=coverage-report.json
        env:
          CI: true

      - name: Upload frontend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: frontend-coverage
          path: apps/web/coverage-report.json
          retention-days: 14

  test-api:
    name: API Tests (Supertest + Postgres)
    runs-on: ubuntu-latest
    needs: [lint, type-check]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: animaforge_test
          POSTGRES_USER: animaforge
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Run API tests with coverage
        run: cd services/platform-api && npx vitest run --coverage --reporter=json --outputFile=coverage-report.json
        env:
          DATABASE_URL: postgresql://animaforge:test_password@localhost:5432/animaforge_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

      - name: Upload API coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: api-coverage
          path: services/platform-api/coverage-report.json
          retention-days: 14

  test-ai-api:
    name: AI API Tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: services/ai-api/requirements.txt

      - name: Install dependencies
        run: |
          cd services/ai-api
          pip install -r requirements.txt
          pip install pytest-cov pytest-asyncio

      - name: Run pytest with coverage
        run: |
          cd services/ai-api
          pytest --cov=src --cov-report=json:coverage-report.json --cov-report=term-missing -v

      - name: Upload AI API coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: ai-api-coverage
          path: services/ai-api/coverage-report.json
          retention-days: 14

  test-e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-frontend, test-api]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: animaforge_test
          POSTGRES_USER: animaforge
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --reporter=html
        env:
          DATABASE_URL: postgresql://animaforge:test_password@localhost:5432/animaforge_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  security-scan:
    name: Security Scan (Semgrep)
    runs-on: ubuntu-latest
    # Runs the maintained Semgrep OSS image directly. The old
    # semgrep/semgrep-action@v1 is retired and ships a Semgrep build that
    # semgrep.dev no longer supports. No SEMGREP_APP_TOKEN is required: the
    # rulesets below are fetched anonymously from the public registry.
    container:
      image: semgrep/semgrep:1.173.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trust workspace
        # Semgrep enumerates targets via git; inside the container the checkout
        # is owned by a different uid than the one running the scan.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Semgrep
        run: |
          set +e
          semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/python \
            --config=p/docker \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --json --output=semgrep-report.json \
            --metrics=off
          status=$?
          # 0 = clean, 1 = findings. Both mean the scan ran; the gate below
          # decides pass/fail. >=2 is a real scanner failure.
          if [ "$status" -ge 2 ]; then
            echo "::error::Semgrep failed to run (exit $status)"
            exit "$status"
          fi

      - name: Gate against accepted-risk register
        run: python3 .github/semgrep/gate.py semgrep-report.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json
          retention-days: 14

  ci-passed:
    name: CI Passed
    runs-on: ubuntu-latest
    if: always()
    needs:
      - lint
      - type-check
      - test-frontend
      - test-api
      - test-ai-api
      - test-e2e
      - security-scan
    steps:
      - name: Check all jobs
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.type-check.result }}" == "failure" ]] || \
             [[ "${{ needs.test-frontend.result }}" == "failure" ]] || \
             [[ "${{ needs.test-api.result }}" == "failure" ]] || \
             [[ "${{ needs.test-ai-api.result }}" == "failure" ]] || \
             [[ "${{ needs.test-e2e.result }}" == "failure" ]] || \
             [[ "${{ needs.security-scan.result }}" == "failure" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed."
