name: Security Scanning

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 06:00 UTC
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: SAST - Semgrep
    runs-on: ubuntu-latest
    # Same maintained Semgrep OSS image as ci.yml, with a wider ruleset. The old
    # semgrep/semgrep-action@v1 is retired; no SEMGREP_APP_TOKEN is required.
    container:
      image: semgrep/semgrep:1.173.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trust workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run Semgrep
        run: |
          set +e
          CUSTOM=""
          if [ -d .semgrep ]; then CUSTOM="--config=.semgrep/"; fi
          semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/python \
            --config=p/docker \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --config=p/sql-injection \
            --config=p/xss \
            $CUSTOM \
            --json --output=semgrep-report.json \
            --metrics=off
          status=$?
          if [ "$status" -ge 2 ]; then
            echo "::error::Semgrep failed to run (exit $status)"
            exit "$status"
          fi

      - name: Gate against accepted-risk register
        run: python3 .github/semgrep/gate.py semgrep-report.json

      - name: Upload Semgrep report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: semgrep-report-full
          path: semgrep-report.json
          retention-days: 30

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: npm audit
        run: |
          npm ci
          npm audit --audit-level=high || true
          # Generate structured report
          npm audit --json > npm-audit-report.json || true

      - name: pip audit
        run: |
          pip install pip-audit
          cd services/ai-api
          pip install -r requirements.txt
          pip-audit --format=json --output=pip-audit-report.json || true
          pip-audit || true

      - name: Upload audit reports
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: dependency-audit-reports
          path: |
            npm-audit-report.json
            services/ai-api/pip-audit-report.json
          retention-days: 30

  container-scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `context` is the docker build context and `file` the Dockerfile.
        #
        # platform-api, auth and web build from the repo root: all three are npm
        # workspaces whose lockfile lives at the root, and web additionally
        # depends on the @animaforge/db workspace package. With a per-service
        # context `npm ci` failed outright (EUSAGE, no package-lock.json), which
        # is why three of five images were never scanned (#20).
        #
        # gateway and ai-api keep their own context: both already build, and
        # neither needs anything above its own directory.
        service:
          - { name: platform-api, context: ., file: services/platform-api/Dockerfile }
          - { name: auth, context: ., file: services/auth/Dockerfile }
          - { name: ai-api, context: services/ai-api, file: services/ai-api/Dockerfile }
          - { name: gateway, context: services/gateway, file: services/gateway/Dockerfile }
          - { name: web, context: ., file: apps/web/Dockerfile }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build image for scanning
        run: |
          docker build -t animaforge/${{ matrix.service.name }}:scan \
            -f ${{ matrix.service.file }} \
            ${{ matrix.service.context }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: animaforge/${{ matrix.service.name }}:scan
          format: 'sarif'
          output: 'trivy-${{ matrix.service.name }}.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3
        if: always()
        with:
          sarif_file: 'trivy-${{ matrix.service.name }}.sarif'
          category: 'trivy-${{ matrix.service.name }}'

      - name: Upload Trivy report artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: trivy-report-${{ matrix.service.name }}
          path: 'trivy-${{ matrix.service.name }}.sarif'
          retention-days: 30

  owasp-zap:
    name: DAST - OWASP ZAP (Stub)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: OWASP ZAP Baseline Scan (stub)
        run: |
          echo "============================================"
          echo "OWASP ZAP Dynamic Application Security Test"
          echo "============================================"
          echo ""
          echo "This is a stub configuration. To enable:"
          echo "1. Set STAGING_BASE_URL in repository secrets"
          echo "2. Uncomment the ZAP action below"
          echo ""
          # TODO: Enable when staging environment is available
          # - name: ZAP Baseline Scan
          #   uses: zaproxy/action-baseline@v0.12.0
          #   with:
          #     target: '${{ secrets.STAGING_BASE_URL }}'
          #     rules_file_name: '.zap/rules.tsv'
          #     cmd_options: '-a -j'

      - name: Generate stub report
        run: |
          echo '{"scan": "stub", "status": "not_configured"}' > zap-report.json

      - name: Upload ZAP report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: owasp-zap-report
          path: zap-report.json
          retention-days: 30

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [semgrep, dependency-audit, container-scan]
    steps:
      - name: Summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST (Semgrep) | ${{ needs.semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Audit | ${{ needs.dependency-audit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container Scan (Trivy) | ${{ needs.container-scan.result }} |" >> $GITHUB_STEP_SUMMARY
